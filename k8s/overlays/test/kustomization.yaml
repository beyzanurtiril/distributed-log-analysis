apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: log-analysis
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: worker-config
    patch: |-
      - op: replace
        path: /data/SHARD_TOTAL
        value: "5"
  - target:
      kind: Job
      name: log-worker-job
    patch: |-
      - op: replace
        path: /spec/completions
        value: 5
      - op: replace
        path: /spec/parallelism
        value: 5
  - target:
      kind: PersistentVolumeClaim
      name: log-data-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
